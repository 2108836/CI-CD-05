name: Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Enter previous Git commit SHA"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  rollback:
    runs-on: ubuntu-latest

    steps:
      - name: AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Rollback EC2 using SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0b26fbdea7e43f90f" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "docker pull ts22abh/calculator-image:${{ inputs.image_tag }}",
              "docker rm -f calculator-app || true",
              "docker run -d --name calculator-app -p 80:5000 ts22abh/calculator-image:${{ inputs.image_tag }}"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Rollback command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0b26fbdea7e43f90f"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0b26fbdea7e43f90f"